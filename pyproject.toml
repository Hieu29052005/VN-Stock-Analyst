[project]
name = "vn-stock-analyst"
version = "0.1.0"
description = "RAG-powered Investment Research Assistant for Vietnamese Stock Market"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "llama-index>=0.12.0",
    "llama-index-vector-stores-chroma>=0.3.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-retrievers-bm25>=0.3.0",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "chromadb>=0.6.0",
    "vnstock>=4.0",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "tiktoken>=0.8",
    "nltk>=3.9",
    "rank-bm25>=0.2",
    "ragas>=0.2.0",
    "datasets>=3.0",
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "streamlit>=1.40",
    "networkx>=3.0",
    "unstructured>=0.16.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
